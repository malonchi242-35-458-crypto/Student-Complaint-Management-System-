<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Complaint Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar">Student Complaint Management System</header>

  <main class="container">
    <h1>Student Complaint Management System</h1>

    <section class="counts">
      <div class="count-card pending">
        <span class="label">Pending</span>
        <span class="value" id="count-pending">0</span>
      </div>
      <div class="count-card in-progress">
        <span class="label">In Progress</span>
        <span class="value" id="count-in-progress">0</span>
      </div>
      <div class="count-card resolved">
        <span class="label">Resolved</span>
        <span class="value" id="count-resolved">0</span>
      </div>
    </section>

    <section class="form-card">
      <h2 id="form-heading">Submit a Complaint</h2>
      <form id="complaint-form">
        <div class="row">
          <input type="text" id="studentName" placeholder="Your name" required />
          <input type="text" id="title" placeholder="Complaint title" required />
        </div>
        <div class="row">
          <select id="category">
            <option value="">Category</option>
            <option value="Academic">Academic</option>
            <option value="Hostel">Hostel</option>
            <option value="Cafeteria">Cafeteria</option>
            <option value="IT / Technical">IT / Technical</option>
            <option value="Administrative">Administrative</option>
            <option value="Other">Other</option>
          </select>
          <input type="date" id="date" />
          <input type="text" id="contactInfo" placeholder="Contact info" required />
        </div>
        <div class="row">
          <textarea id="description" placeholder="Describe the issue in detail..."></textarea>
        </div>
        <div id="form-status" class="form-status"></div>
        <button type="submit" id="submit-btn">Submit Complaint</button>
        <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel Edit</button>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>All Complaints</h2>
        <div class="controls">
          <input type="text" id="search" placeholder="Search by title, name, category" />
          <select id="filter">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>
      <ul id="complaint-list"></ul>
      <p id="empty-message" class="empty-message">No complaints yet. Submit one above to get started.</p>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
