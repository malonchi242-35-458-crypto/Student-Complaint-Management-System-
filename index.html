<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; script-src 'self';"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Complaint Management System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="page-header">
      <h1>Student Complaint Management System</h1>
      <p>Submit, track, update, and resolve student complaints.</p>
    </header>

    <section class="stats-grid">
      <div class="stat-card pending">
        <span>Pending</span>
        <strong id="pendingCount">0</strong>
      </div>

      <div class="stat-card progress">
        <span>In Progress</span>
        <strong id="inProgressCount">0</strong>
      </div>

      <div class="stat-card resolved">
        <span>Resolved</span>
        <strong id="resolvedCount">0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2 id="formHeading">Submit a Complaint</h2>
          <p>Enter the complaint details below.</p>
        </div>
        <button id="cancelEditBtn" class="btn btn-light hidden" type="button">
          Cancel Edit
        </button>
      </div>

      <form id="complaintForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="studentName">Student Name *</label>
            <input id="studentName" name="studentName" type="text" required>
          </div>

          <div class="form-group">
            <label for="title">Complaint Title *</label>
            <input id="title" name="title" type="text" required>
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="">Select category</option>
              <option value="Academic">Academic</option>
              <option value="Hostel">Hostel</option>
              <option value="Cafeteria">Cafeteria</option>
              <option value="IT / Technical">IT / Technical</option>
              <option value="Administrative">Administrative</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date *</label>
            <input id="date" name="date" type="date" required>
          </div>

          <div class="form-group">
            <label for="contactInfo">Contact Information *</label>
            <input id="contactInfo" name="contactInfo" type="tel" required>
          </div>

          <div class="form-group full-width">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"
              placeholder="Describe the complaint in more detail..."></textarea>
          </div>
        </div>

        <div id="formMessage" class="message hidden"></div>

        <div class="form-actions">
          <button id="submitBtn" class="btn btn-primary" type="submit">
            Submit Complaint
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-header complaints-header">
        <div>
          <h2>All Complaints</h2>
          <p id="totalText">0 complaints</p>
        </div>

        <div class="filters">
          <input
            id="searchInput"
            type="search"
            placeholder="Search by title, name, category..."
            aria-label="Search complaints"
          >

          <select id="filterInput" aria-label="Filter by status">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h3>No complaints yet</h3>
        <p>Submit a complaint above to get started.</p>
      </div>

      <div id="complaintList" class="complaint-list"></div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
